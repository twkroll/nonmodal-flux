<svg xmlns="http://www.w3.org/2000/svg" width="690" height="345" viewBox="0 0 690 345"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:16px;font-weight:bold}.s{font-size:12px}.xs{font-size:10px}.a{stroke:#111;stroke-width:1;fill:none}.g{stroke:#aaa;stroke-width:.6}.l1{stroke:#111;stroke-width:2;fill:none}.l2{stroke:#555;stroke-width:2;fill:none;stroke-dasharray:6 4}.l3{stroke:#888;stroke-width:2;fill:none;stroke-dasharray:2 3}.box{fill:#f7f7f7;stroke:#555;stroke-width:1}</style><text x="20" y="25" class="t" text-anchor="start" font-weight="normal">Figure 1. Common frozen-data workflow</text><rect x="25" y="55" width="145" height="88" rx="4" class="box"/><text x="97" y="77" class="s" text-anchor="middle" font-weight="bold">1  Freeze tuple</text><text x="97" y="101" class="xs" text-anchor="middle" font-weight="normal">A, M, Q, B, R_in</text><text x="97" y="117" class="xs" text-anchor="middle" font-weight="normal">fixed before effect inspection</text><text x="180" y="104" class="t" text-anchor="middle" font-weight="normal">→</text><rect x="190" y="55" width="145" height="88" rx="4" class="box"/><text x="262" y="77" class="s" text-anchor="middle" font-weight="bold">2  Build objectives</text><text x="262" y="101" class="xs" text-anchor="middle" font-weight="normal">positive terminal metric</text><text x="262" y="117" class="xs" text-anchor="middle" font-weight="normal">versus signed channel</text><text x="345" y="104" class="t" text-anchor="middle" font-weight="normal">→</text><rect x="355" y="55" width="145" height="88" rx="4" class="box"/><text x="427" y="77" class="s" text-anchor="middle" font-weight="bold">3  Compare diagnostics</text><text x="427" y="101" class="xs" text-anchor="middle" font-weight="normal">geometry: theta</text><text x="427" y="117" class="xs" text-anchor="middle" font-weight="normal">performance: Delta_Q</text><text x="510" y="104" class="t" text-anchor="middle" font-weight="normal">→</text><rect x="520" y="55" width="145" height="88" rx="4" class="box"/><text x="592" y="77" class="s" text-anchor="middle" font-weight="bold">4  Gate robustness</text><text x="592" y="101" class="xs" text-anchor="middle" font-weight="normal">residual/direct checks</text><text x="592" y="117" class="xs" text-anchor="middle" font-weight="normal">and prescribed refinement</text><text x="25" y="180" class="s" text-anchor="start" font-weight="bold">Domain semantics are intentionally distinct</text><text x="30" y="205" class="s" text-anchor="start" font-weight="bold">Plasma</text><text x="140" y="205" class="s" text-anchor="start" font-weight="normal">free energy</text><text x="380" y="205" class="s" text-anchor="start" font-weight="normal">particle transport</text><text x="30" y="239" class="s" text-anchor="start" font-weight="bold">Neuro</text><text x="140" y="239" class="s" text-anchor="start" font-weight="normal">synaptic-filter storage</text><text x="380" y="239" class="s" text-anchor="start" font-weight="normal">V1-SP → V4-SS contribution</text><text x="30" y="273" class="s" text-anchor="start" font-weight="bold">Climate-A</text><text x="140" y="273" class="s" text-anchor="start" font-weight="normal">QG perturbation energy</text><text x="380" y="273" class="s" text-anchor="start" font-weight="normal">poleward eddy heat transport</text><text x="25" y="320" class="xs" text-anchor="start" font-weight="normal">Climate-B is not a fourth robust domain; it is a Supplement robustness-rejection case.</text></svg>