name: Build theory PDFs

on:
  push:
    paths:
      - 'docs/theory_progress.tex'
      - 'docs/stochastic_cascade_progress.tex'
      - '.github/workflows/build-theory-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-theory-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile main theory note
        uses: xu-cheng/latex-action@v3
        with:
          root_file: theory_progress.tex
          working_directory: docs
          latexmk_use_xelatex: false

      - name: Compile stochastic-cascade note
        uses: xu-cheng/latex-action@v3
        with:
          root_file: stochastic_cascade_progress.tex
          working_directory: docs
          latexmk_use_xelatex: false

      - name: Commit generated PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/theory_progress.pdf docs/stochastic_cascade_progress.pdf
          if git diff --cached --quiet; then
            echo "PDFs unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "docs: rebuild theory PDFs"
          git push
